<style>
.sidebar{
    width:260px;flex-shrink:0;background:var(--qcc-bg-card);border-right:1px solid var(--qcc-border-light);display:flex;flex-direction:column;overflow-y:auto;transition:width var(--qcc-transition-base)
}
.sidebar.collapsed{width:72px}
.sidebar.collapsed .side-logo-text,.sidebar.collapsed .side-sub,.sidebar.collapsed .side-section-title,.sidebar.collapsed .side-link span,.sidebar.collapsed .side-user-info{display:none}
.sidebar.collapsed .side-link{justify-content:center;padding:8px}
.sidebar.collapsed .side-footer{padding:8px;justify-content:center}
.side-header{padding:18px 16px 14px;border-bottom:1px solid var(--qcc-border-lighter);display:flex;align-items:center;justify-content:space-between}
.side-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--qcc-text-primary)}
.side-logo-icon{width:32px;height:32px;border-radius:var(--qcc-radius-sm);background:linear-gradient(135deg,var(--qcc-primary),#6366f1);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:var(--qcc-font-weight-bold);color:#fff;flex-shrink:0}
.side-logo-text{font-size:var(--qcc-font-size-lg);font-weight:var(--qcc-font-weight-bold)}
.side-sub{font-size:11px;color:var(--qcc-text-placeholder);margin-top:1px}
.side-collapse-btn{padding:4px;border-radius:var(--qcc-radius-sm);color:var(--qcc-text-secondary);cursor:pointer;transition:all var(--qcc-transition-base);background:none;border:none}
.side-collapse-btn:hover{background:var(--qcc-bg-hover);color:var(--qcc-text-primary)}
.side-nav{flex:1;padding:10px 8px}
.side-section{margin-bottom:12px}
.side-section-title{font-size:11px;font-weight:var(--qcc-font-weight-semibold);text-transform:uppercase;letter-spacing:.06em;color:var(--qcc-text-placeholder);padding:4px 8px 4px}
.side-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--qcc-radius-sm);color:var(--qcc-text-secondary);font-size:var(--qcc-font-size-sm);font-weight:var(--qcc-font-weight-medium);transition:all var(--qcc-transition-base);text-decoration:none}
.side-link:hover{background:var(--qcc-bg-hover);color:var(--qcc-text-primary)}
.side-link.active{background:var(--qcc-bg-active);color:var(--qcc-primary);font-weight:var(--qcc-font-weight-semibold)}
.side-link svg{width:18px;height:18px;flex-shrink:0;opacity:.5}
.side-link.active svg{opacity:1}
.side-footer{padding:12px;border-top:1px solid var(--qcc-border-lighter);display:flex;align-items:center;gap:8px}
.side-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--qcc-primary),#6366f1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:var(--qcc-font-weight-bold);color:#fff;flex-shrink:0}
.side-user-info{flex:1;min-width:0}
.side-user-name{font-size:var(--qcc-font-size-sm);font-weight:var(--qcc-font-weight-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user-role{font-size:11px;color:var(--qcc-text-placeholder)}
.side-logout{color:var(--qcc-text-placeholder);padding:4px;border-radius:var(--qcc-radius-sm);transition:all var(--qcc-transition-base)}
.side-logout:hover{color:var(--qcc-danger);background:var(--qcc-color-danger-50)}
</style>

<aside class="sidebar" :class="{ collapsed: sidebarCollapsed }" x-data="{ sidebarCollapsed: false }">
    <div class="side-header">
        <a href="/page/dashboard" class="side-logo">
            <div class="side-logo-icon">Q</div>
            <div>
                <div class="side-logo-text">QCC</div>
                <div class="side-sub">测试报告平台</div>
            </div>
        </a>
        <button class="side-collapse-btn" @click="sidebarCollapsed = !sidebarCollapsed" title="折叠菜单">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </div>
    <nav class="side-nav">
        <div class="side-section">
            <div class="side-section-title">概览</div>
            <a href="/page/dashboard" class="side-link {{ 'active' if active_page=='dashboard' else '' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>仪表盘</span>
            </a>
        </div>
        <div class="side-section">
            <div class="side-section-title">测试管理</div>
            <a href="/page/projects" class="side-link {{ 'active' if active_page=='projects' else '' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>项目列表</span>
            </a>
            <a href="/page/templates" class="side-link {{ 'active' if active_page=='templates' else '' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <span>报告模板</span>
            </a>
        </div>
        <div class="side-section">
            <div class="side-section-title">质量追踪</div>
            <a href="/page/bugs" class="side-link {{ 'active' if active_page=='bugs' else '' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>Bug 管理</span>
            </a>
            <a href="/page/requirements" class="side-link {{ 'active' if active_page=='requirements' else '' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
                <span>需求管理</span>
            </a>
            <a href="/page/tasks" class="side-link {{ 'active' if active_page=='tasks' else '' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
                <span>任务看板</span>
            </a>
            <a href="/page/autotest" class="side-link {{ 'active' if active_page=='autotest' else '' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                <span>自动测试</span>
            </a>
            <a href="/page/report" class="side-link {{ 'active' if active_page=='report' else '' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span>报告中心</span>
            </a>
        </div>

        <div class="side-section">
            <div class="side-section-title">个人</div>
            <a href="/page/workspace" class="side-link {{ 'active' if active_page=='workspace' else '' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>我的工作台</span>
            </a>
        </div>

        <div class="side-section">
            <div class="side-section-title">配置</div>
            <a href="/page/products" class="side-link {{ 'active' if active_page=='products' else '' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                <span>产品管理</span>
            </a>
        </div>
    </nav>
    <div class="side-footer">
        <div class="side-avatar">{{ user.display_name[0] if user.display_name else 'U' }}</div>
        <div class="side-user-info">
            <div class="side-user-name">{{ user.display_name }}</div>
            <div class="side-user-role">{{ user.role }}</div>
        </div>
        <a href="/page/logout" class="side-logout" title="退出登录">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
    </div>
</aside>
