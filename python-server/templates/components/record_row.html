<div class="item-row saved-flash" id="row-{{ record.id }}">
    <div class="item-no">{{ item.item_no }}</div>
    <div>
        <div class="item-name">{{ item.test_item }}</div>
        {% if item.test_case or item.condition_desc %}
        <div class="item-desc">{{ item.test_case or item.condition_desc }}</div>
        {% endif %}
    </div>
    <div class="item-result">
        <select class="form-select"
                hx-put="/page/projects/{{ project_id }}/records/{{ record.id }}"
                hx-target="#row-{{ record.id }}"
                hx-swap="outerHTML"
                hx-trigger="change"
                name="result">
            <option value="">-- 选择 --</option>
            {% for r in ['Pass','Fail','NA','Blocked','Error','Manual'] %}
            <option value="{{ r }}" {% if record.result == r %}selected{% endif %}>{{ r }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="item-comment">
        <input type="text" placeholder="备注（回车保存）"
               value="{{ record.comment or '' }}"
               hx-put="/page/projects/{{ project_id }}/records/{{ record.id }}"
               hx-target="#row-{{ record.id }}"
               hx-swap="outerHTML"
               hx-trigger="keyup[key=='Enter']"
               hx-include="previous select"
               name="comment">
    </div>
    <div>
        {% set r = record.result or '' %}
        <span class="{% if r=='Pass' %}result-pass{% elif r=='Fail' %}result-fail{% elif r=='Blocked' %}result-blocked{% elif r=='NA' %}result-na{% elif r=='Error' %}result-fail{% else %}text-muted{% endif %}" style="font-size:12px">
            {{ r or '未测' }}
        </span>
    </div>
</div>
